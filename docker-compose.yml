name: it-tools

services:
  app:
    image: it-tools-app:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      WEB_DIST_DIR: /app/dist
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,https://www.toolkitpub.com}"
      I18N_TRANSLATE_API_URL: "${I18N_TRANSLATE_API_URL:-}"
      I18N_TRANSLATE_API_KEY: "${I18N_TRANSLATE_API_KEY:-}"
      I18N_TRANSLATE_API_MODEL: "${I18N_TRANSLATE_API_MODEL:-}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
